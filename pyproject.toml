[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name="aloeschema"
version = "0.3.3"
description="Aloeschema is a simple schema.org accessor and validator that allows custom types and properties"
authors = [{email = "michael@aloecraft.org"}]
maintainers = [{email = "michael@aloecraft.org"}]
readme = "README.md"
license = "apache-2.0"
requires-python = ">=3.11"

dependencies = [
    "requests"
]

[project.urls]
Homepage = "https://github.com/Aloecraft-org/aloeschema"
Repository = "https://github.com/Aloecraft-org/aloeschema"

[project.optional-dependencies]
test = [
    "pytest",
    "coverage",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--verbose" # Example options for verbose output and coverage
testpaths = [
    "tests",
]

[tool.setuptools]
package-dir = { "aloeschema" = "src" }
# Subpackages are NOT implied by listing the parent -- aloeschema.data was
# missing from every wheel and sdist up to 0.3.1, so load_schema_org() raised
# ModuleNotFoundError on any non-editable install. tests/test_packaging.py
# fails if a package directory under src/ is missing from this list.
packages = ["aloeschema", "aloeschema.data"]