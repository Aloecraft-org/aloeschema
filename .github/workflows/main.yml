name: CI/CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]

    - name: Run tests
      run: |
        pytest tests/

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ruff
      run: pip install ruff

    # F811 catches redefinitions. Every source file in this repo once carried
    # three copies of the same definitions, which silently disabled two of the
    # three enumeration tests.
    - name: Lint
      run: |
        ruff check --select F,E4,E7,E9 src tests
        ruff format --check src tests

  wheel:
    # Installs the built distribution into a clean environment and runs the
    # README examples against it. The test job above uses `pip install -e .`,
    # which resolves against the source tree and so cannot catch a packaging
    # error such as aloeschema.data being left out of the wheel.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel

    - name: Install the wheel on its own
      run: pip install dist/*.whl

    - name: Confirm the bundled schema data shipped
      run: |
        python -c "import aloeschema.data.schemaorg_current as m; print(m.__file__)"

    - name: Run the README examples against the installed wheel
      run: |
        pip install pytest
        cd "$RUNNER_TEMP"
        python -m pytest "$GITHUB_WORKSPACE/tests/test_readme.py" -v